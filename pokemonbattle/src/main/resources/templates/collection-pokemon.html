<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokéBattle - Collection</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
</head>
<body data-page="collection">
<div class="page" id="collection-page">
  <nav>
    <div class="nav-logo"><div class="nav-logo-icon">📖</div><span class="nav-logo-text">PokéBattle</span></div>
    <div class="nav-links">
      <button class="nav-link" onclick="goTo('home')"><i class="ti ti-home" aria-hidden="true"></i> Home</button>
      <button class="nav-link active" onclick="goTo('collection')"><i class="ti ti-book" aria-hidden="true"></i> Collection</button>
      <button class="nav-link" onclick="goTo('battle-home')"><i class="ti ti-sword" aria-hidden="true"></i> Battle</button>
      <button class="nav-link" onclick="goTo('inventory')"><i class="ti ti-package" aria-hidden="true"></i> Inventory</button>
    </div>
    <div class="nav-right">
      <button class="btn-logout" onclick="goTo('login')"><i class="ti ti-logout" aria-hidden="true"></i> Logout</button>
    </div>
  </nav>

  <div class="page-content">
    <div class="page-header">
      <div class="page-title" style="color:var(--accent)">Koleksi Pokémon</div>
      <div class="page-sub">Daftar semua Pokémon yang berhasil kamu kumpulkan dan latih!</div>
    </div>

    <div class="collection-grid" id="collection-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;">
        <p style="color: var(--text3);">Memuat koleksi Pokémon...</p>
    </div>
  </div>
</div>

<script>
  // Fungsi navigasi
  function goTo(page) {
      window.location.href = '/' + page; 
  }

  // FITUR TARIK DATA KOLEKSI POKEMON
  async function fetchCollectionData() {
      // 1. Definisikan dulu grid-nya
      const grid = document.getElementById('collection-grid');
      if (!grid) return;

      try {
          // 2. Harus nge-fetch dulu biar ada 'response'
          const response = await fetch('/api/collection'); 
          
          if (!response.ok) throw new Error('Gagal mengambil data koleksi');
          const pokemons = await response.json();

          // 3. Mengosongkan teks "Memuat koleksi Pokémon..."
          grid.innerHTML = ''; 

          if (pokemons.length === 0) {
              grid.innerHTML = '<p style="color: var(--text3);">Koleksi kamu masih kosong. Ayo tangkap Pokémon!</p>';
              return;
          }

          // 4. Looping untuk merender kartu Pokemon (ini yang tadi hilang)
          pokemons.forEach(pokemon => {
              const card = document.createElement('div');
              card.style.cssText = 'background: rgba(30, 30, 30, 0.6); border: 1px solid var(--accent); border-radius: 12px; padding: 20px; text-align: center; position: relative;';
              
              let icon = 'ti-pokeball';
              let typeColor = '#777'; 
              
              if(pokemon.type === 'FIRE') { icon = 'ti-flame'; typeColor = '#ff5e5e'; }
              if(pokemon.type === 'WATER') { icon = 'ti-droplet'; typeColor = '#5e81ff'; }
              if(pokemon.type === 'GRASS') { icon = 'ti-leaf'; typeColor = '#5eff81'; }
              if(pokemon.type === 'ELECTRIC') { icon = 'ti-bolt'; typeColor = '#f5d44f'; }
              if(pokemon.type === 'ICE') { icon = 'ti-snowflake'; typeColor = '#a8e4ff'; }
              if(pokemon.type === 'POISON') { icon = 'ti-skull'; typeColor = '#b75eff'; }

              card.innerHTML = `
                  <div style="position: absolute; top: 15px; right: 15px; background: ${typeColor}; color: white; font-size: 10px; font-weight: bold; padding: 4px 8px; border-radius: 4px;">
                      ${pokemon.type}
                  </div>
                  <i class="ti ${icon}" style="font-size: 40px; color: ${typeColor}; margin-bottom: 10px; display: block;"></i>
                  <h3 style="margin: 0 0 10px 0; color: white; font-size: 22px;">${pokemon.name}</h3>
                  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; background: #222; padding: 12px; border-radius: 8px;">
                      <div style="font-size: 12px; color: var(--text3);">
                          <i class="ti ti-heart" style="color: #ff5e5e;"></i> HP: <span style="color: white; font-weight: bold;">${pokemon.hp}/${pokemon.max_hp}</span>
                      </div>
                      <div style="font-size: 12px; color: var(--text3);">
                          <i class="ti ti-sword" style="color: #5e81ff;"></i> Atk: <span style="color: white; font-weight: bold;">${pokemon.attack}</span>
                      </div>
                      <div style="font-size: 12px; color: var(--text3);">
                          <i class="ti ti-shield" style="color: #5eff81;"></i> Def: <span style="color: white; font-weight: bold;">${pokemon.defense}</span>
                      </div>
                  </div>
              `;
              grid.appendChild(card);
          });

      } catch (error) {
          console.error('Error:', error);
          grid.innerHTML = '<p style="color: #ff5e5e;">Terjadi kesalahan saat memuat data koleksi.</p>';
      }
  }

  // Tarik data saat halaman dimuat
  document.addEventListener('DOMContentLoaded', () => {
    fetchCollectionData();
  });
</script>
</body>
</html>
