<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokéBattle - Login</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">


  <style>
    .auth-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .auth-card {
      background: rgba(30, 30, 30, 0.6);
      border: 1px solid var(--accent, #555);
      border-radius: 12px;
      padding: 40px 30px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .auth-input {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: white;
      font-size: 14px;
      box-sizing: border-box;
    }

    .auth-input:focus {
      outline: none;
      border-color: var(--accent, #ff5e5e);
    }

    .auth-toggle {
      margin-top: 20px;
      font-size: 13px;
      color: var(--text3, #aaa);
      cursor: pointer;
      transition: color 0.2s;
    }

    .auth-toggle:hover {
      color: var(--accent, #ff5e5e);
      text-decoration: underline;
    }

    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 25px;
    }
  </style>
</head>

<body data-page="login">

  <div class="auth-wrapper">

    <div class="auth-card" id="form-login">
      <div class="logo-container">
        <div class="nav-logo-icon" style="font-size: 28px;">⚔️</div>
        <span class="nav-logo-text" style="font-size: 24px; font-weight: bold;">PokéBattle</span>
      </div>

      <div class="page-title" style="color:var(--accent); font-size: 20px;">Login Trainer</div>
      <div class="page-sub" style="margin-bottom: 24px; font-size: 14px;">Masuk untuk melanjutkan petualanganmu!</div>

      <form onsubmit="handleLogin(event)">
        <input type="text" class="auth-input" placeholder="Nama Trainer" id="login-username" required>
        <input type="password" class="auth-input" placeholder="Password" id="login-password" required>

        <button type="submit" class="btn btn-red btn-lg" style="width: 100%; justify-content: center;">
          <i class="ti ti-login" aria-hidden="true"></i> Masuk
        </button>
      </form>

      <div class="auth-toggle">
        <a th:href="@{/register}" style="color: inherit; text-decoration: none;">Belum punya lisensi Trainer? Daftar di
          sini.</a>
      </div>
    </div>

  </div>

  <script src="/js/main.js"></script>
</body>

</html>
