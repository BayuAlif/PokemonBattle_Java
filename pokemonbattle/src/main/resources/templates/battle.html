<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéBattle - Arena</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <style>
        /* ========================================= */
        /* CSS KHUSUS ARENA (DESAIN BARU)            */
        /* ========================================= */
        .battle-arena {
            background:
                /* Efek hamparan rumput hijau di bagian bawah */
                linear-gradient(to top, #2e7d32 0%, #4caf50 35%, rgba(0, 0, 0, 0) 35.5%),
                /* Efek siluet bukit/pegunungan tipis di tengah */
                linear-gradient(135deg, #a5d6a7 0%, #a5d6a7 100%),
                /* Efek gradasi langit cerah di bagian atas */
                linear-gradient(to bottom, #4fc3f7 0%, #e1f5fe 65%);
            background-size: 100% 100%;
            border: 3px solid #1e293b;
            border-radius: 16px;
            height: 400px;
            position: relative;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), inset 0 0 40px rgba(0, 0, 0, 0.2);
        }

        /* Modifikasi warna platform pijakan agar kontras dengan rumput hijau */
        .arena-platform {
            position: absolute;
            width: 180px;
            height: 45px;
            background: radial-gradient(ellipse at center, rgba(15, 45, 15, 0.6) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            z-index: 1;
        }

        /* Posisi Stat Box (TETAP SEPERTI MILIKMU) */
        .stat-box {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 12px;
            width: 260px;
            position: absolute;
            z-index: 10;
            backdrop-filter: blur(4px);
        }

        .stat-box.enemy {
            top: 20px;
            right: 20px;
            border-bottom-left-radius: 25px;
            border-top-right-radius: 0;
        }

        .stat-box.player {
            bottom: 20px;
            left: 20px;
            border-top-right-radius: 25px;
            border-bottom-left-radius: 0;
        }

        .hp-bar-bg {
            background: #334155;
            height: 12px;
            border-radius: 6px;
            margin: 10px 0;
            overflow: hidden;
            border: 1px solid #0f172a;
        }

        .hp-bar-fill {
            background: linear-gradient(90deg, #10b981, #34d399);
            height: 100%;
            width: 100%;
            transition: width 0.5s ease-in-out, background-color 0.5s;
        }

        .hp-bar-fill.warning {
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
        }

        .hp-bar-fill.danger {
            background: linear-gradient(90deg, #ef4444, #f87171);
        }

        /* Pijakan (Platform) Arena */
        .arena-platform {
            position: absolute;
            width: 180px;
            height: 50px;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            z-index: 1;
        }

        .platform-enemy {
            top: 120px;
            right: 60px;
        }

        .platform-player {
            bottom: 100px;
            left: 60px;
        }

        /* Sprite Karakter */
        .sprite-container {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            font-size: 50px;
            color: white;
            z-index: 5;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .sprite-enemy {
            top: 50px;
            right: 100px;
            background: linear-gradient(135deg, #475569, #1e293b);
        }

        .sprite-player {
            bottom: 120px;
            left: 100px;
            background: linear-gradient(135deg, #475569, #1e293b);
        }

        /* ANIMASI KEYFRAMES (UNTUK EFEK SERANG & DAMAGE) */
        @keyframes attack-player {
            0% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(150px, -80px) scale(1.2);
            }

            100% {
                transform: translate(0, 0);
            }
        }

        @keyframes attack-enemy {
            0% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-150px, 80px) scale(1.2);
            }

            100% {
                transform: translate(0, 0);
            }
        }

        @keyframes damage-shake {

            0%,
            100% {
                transform: translateX(0);
                filter: brightness(1);
            }

            20% {
                transform: translateX(-15px) rotate(-5deg);
                filter: brightness(2) saturate(3) hue-rotate(-50deg);
            }

            40% {
                transform: translateX(15px) rotate(5deg);
            }

            60% {
                transform: translateX(-15px) rotate(-5deg);
            }

            80% {
                transform: translateX(15px) rotate(5deg);
                filter: brightness(2) saturate(3) hue-rotate(-50deg);
            }
        }

        @keyframes faint-drop {
            0% {
                transform: translateY(0);
                opacity: 1;
            }

            100% {
                transform: translateY(100px) scale(0.5);
                opacity: 0;
            }
        }

        .anim-attack-player {
            animation: attack-player 0.6s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .anim-attack-enemy {
            animation: attack-enemy 0.6s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .anim-damage {
            animation: damage-shake 0.5s ease-in-out;
        }

        .anim-faint {
            animation: faint-drop 1s forwards;
        }

        /* Dashboard Bawah */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: stretch;
        }

        .battle-log {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 12px;
            height: 160px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.5;
            color: #e2e8f0;
        }

        .action-panel {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--accent);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }

        .btn-action {
            background: #1e293b;
            border: 1px solid #475569;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            padding: 12px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
        }

        .btn-action i {
            font-size: 20px;
            color: var(--text3);
            transition: color 0.2s;
        }

        .btn-action:hover {
            background: var(--accent);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(230, 57, 70, 0.3);
        }

        .btn-action:hover i {
            color: white;
        }

        .btn-action.disabled {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>

<body data-page="battle">
    <div class="page" id="battle-page">
        <nav>
            <div class="nav-logo">
                <div class="nav-logo-icon">⚔️</div><span class="nav-logo-text">PokéBattle</span>
            </div>
            <div class="nav-links">
                <button class="nav-link" onclick="goTo('home')"><i class="ti ti-home"></i> Home</button>
                <button class="nav-link" onclick="goTo('collection')"><i class="ti ti-book"></i> Collection</button>
                <button class="nav-link active" onclick="goTo('battle-ingame')"><i class="ti ti-sword"></i>
                    Battle</button>
                <button class="nav-link" onclick="goTo('inventory')"><i class="ti ti-package"></i> Inventory</button>
            </div>
            <div class="nav-right">
                <button class="btn-logout" onclick="handleLogout()"><i class="ti ti-logout"></i> Logout</button>
            </div>
        </nav>

        <div class="page-content">

            <div id="phase-selection" style="display: block;">
                <div class="page-header">
                    <div class="page-title" style="color:var(--accent)"><i class="ti ti-pokeball"></i> Deploy Pokémon
                    </div>
                    <div class="page-sub">Pilih satu Pokémon dari koleksimu untuk bertarung!</div>
                </div>

                <div class="collection-grid" id="deploy-grid"
                    style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;">
                    <p style="color: var(--text3);">Memuat tim Pokémon...</p>
                </div>
            </div>

            <div id="phase-arena" style="display: none;">

                <div class="battle-arena">
                    <div class="arena-platform platform-enemy"></div>
                    <div class="arena-platform platform-player"></div>
                    <div class="sprite-container sprite-enemy" id="sprite-enemy"><i class="ti ti-ghost"
                            id="icon-enemy"></i></div>
                    <div class="sprite-container sprite-player" id="sprite-player"><i class="ti ti-brand-snapchat"
                            id="icon-player"></i></div>

                    <div class="stat-box enemy">
                        <h3 style="margin: 0 0 5px 0; color: white; display: flex; justify-content: space-between;">
                            <span id="enemy-name">Memuat...</span>
                            <span
                                style="font-size: 10px; background:#ef4444; padding:2px 6px; border-radius:4px;">Musuh</span>
                        </h3>
                        <div class="hp-bar-bg">
                            <div class="hp-bar-fill" id="enemy-hp-bar" style="width: 100%;"></div>
                        </div>
                        <div
                            style="display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; font-weight:bold;">
                            <span><i class="ti ti-heart"></i> HP</span>
                            <span id="enemy-hp-text">0 / 0</span>
                        </div>
                    </div>

                    <div class="stat-box player">
                        <h3 style="margin: 0 0 5px 0; color: white; display: flex; justify-content: space-between;">
                            <span id="player-name">Memuat...</span>
                            <span
                                style="font-size: 10px; background:#3b82f6; padding:2px 6px; border-radius:4px;">Pemain</span>
                        </h3>
                        <div class="hp-bar-bg">
                            <div class="hp-bar-fill" id="player-hp-bar" style="width: 100%;"></div>
                        </div>
                        <div
                            style="display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; font-weight:bold;">
                            <span><i class="ti ti-heart"></i> HP</span>
                            <span id="player-hp-text">0 / 0</span>
                        </div>
                    </div>
                </div>

                <div class="dashboard">
                    <div class="battle-log" id="battle-log">
                        <p style="color: #94a3b8;">[Sistem] Menunggu pertarungan dimulai...</p>
                    </div>

                    <div class="action-panel">
                        <div class="action-grid" id="menu-main">
                            <button class="btn-action" onclick="toggleMenu('menu-skills')">
                                <i class="ti ti-sword"></i> Attack
                            </button>
                            <button class="btn-action" onclick="toggleMenu('menu-items')">
                                <i class="ti ti-package"></i> Item
                            </button>
                            <button class="btn-action" onclick="executeSwapRandom()" id="btn-menu-swap">
                                <i class="ti ti-refresh"></i> Swap (3)
                            </button>
                            <button class="btn-action" onclick="executeCatch()" id="btn-menu-catch">
                                <i class="ti ti-pokeball"></i> Catch
                            </button>

                            <button class="btn-action" style="grid-column: span 2; background: #334155;"
                                onclick="window.location.href='/home'">
                                <i class="ti ti-run"></i> Run Away
                            </button>
                        </div>

                        <div class="action-grid" id="menu-skills" style="display: none;">
                            <button class="btn-action" id="btn-skill-1" onclick="executeAttack(1)"
                                style="flex-direction: row;">Skill 1</button>
                            <button class="btn-action" id="btn-skill-2" onclick="executeAttack(2)"
                                style="flex-direction: row;">Skill 2</button>
                            <button class="btn-action" id="btn-skill-3" onclick="executeAttack(3)"
                                style="flex-direction: row;">Skill 3</button>
                            <button class="btn-action" id="btn-skill-4" onclick="executeAttack(4)"
                                style="flex-direction: row;">Skill 4</button>
                            <button class="btn-action"
                                style="background: #334155; grid-column: span 2; flex-direction: row;"
                                onclick="toggleMenu('menu-main')"><i class="ti ti-arrow-left"></i> Kembali</button>
                        </div>

                        <div class="action-grid" id="menu-items" style="display: none;">
                            <div id="item-list-container"
                                style="grid-column: span 2; display: flex; flex-direction: column; gap: 5px; overflow-y: auto; max-height: 100px;">
                                <p style="color: var(--text3); font-size: 12px; text-align: center;">Memuat item...</p>
                            </div>
                            <button class="btn-action"
                                style="background: #334155; grid-column: span 2; flex-direction: row;"
                                onclick="toggleMenu('menu-main')"><i class="ti ti-arrow-left"></i> Kembali</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="/js/main.js"></script>

</body>

</html>
